# Causal Conv-TasNet baseline (PLAN.md §4.3) — time-domain, SI-SDR loss, offline evaluation only
run_name: conv_tasnet
seed: 0
device: auto

model:
  name: conv_tasnet
  kwargs: {N: 256, L: 16, B: 128, H: 256, P: 3, X: 6, R: 2}

data:
  manifests: data/vbd16k/manifests
  segment: 32000
  remix_prob: 0.5
  snr_range: [-5.0, 20.0]
  gain_prob: 0.5
  gain_dbfs: [-25.0, -5.0]
  extra_noise_dir: null
  num_workers: null

loss:
  spec_weight: 0.0
  mrstft_weight: 0.0
  sisdr_weight: 1.0

optim:
  lr: 1.0e-3
  weight_decay: 1.0e-5
  betas: [0.9, 0.999]
  grad_clip: 5.0
  ema_decay: 0.999

schedule:
  epochs: 100
  warmup_epochs: 2
  min_lr_ratio: 0.01

batch_size: 16

val:
  every_epochs: 1
  metrics_every_epochs: 2
  subset: 200
  batch_size: 4
  workers: null

log_every: 25
