[project]
name = "ans"
version = "0.1.0"
description = "Real-time causal neural speech enhancement (training, evaluation, ONNX export)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "soundfile>=0.12",
    "soxr>=0.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "tensorboard>=2.16",
    "pesq>=0.0.4",
    "pystoi>=0.4",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript>=0.1",
]

[project.optional-dependencies]
sim = ["onnxsim>=0.4"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ans"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["runs", "checkpoints", "exports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E741", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# CI (Linux) installs the CPU-only torch wheels instead of the multi-GB CUDA build; macOS resolves from PyPI as before.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
